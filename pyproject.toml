[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ableton-osc-gesture-mcp"
version = "0.4.0"
description = "Project-agnostic MCP adapter and gesture engine for AbletonOSC"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ableton-osc-mcp = "osc_mcp.server:main"

[tool.setuptools.packages.find]
include = ["osc_mcp*"]
