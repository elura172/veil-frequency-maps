[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veil-ableton-osc-mcp"
version = "0.1.0"
description = "Hybrid MCP adapter for AbletonOSC with AbletonMCP fallback"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
veil-ableton-osc = "osc_mcp.server:main"

[tool.setuptools.packages.find]
include = ["osc_mcp*"]
